<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Q&amp;A</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #fff; --text: #1b2230; --muted: #6b7385; --line: #e3e6ee;
    --accent: #3b5bdb; --accent-soft: #e8edff; --warn-bg: #fff6e0; --warn-line: #f0b429; --warn-text: #7a5300;
    --err: #c92a2a; --ok: #2b8a3e; --user: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2029; --text: #e7eaf2; --muted: #9099ad; --line: #2c3340;
      --accent: #7c93ff; --accent-soft: #252c47; --warn-bg: #3a2f14; --warn-line: #b8891f; --warn-text: #f3d28a;
      --err: #ff8787; --ok: #69db7c; --user: #4c63d8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { max-width: 820px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 1rem; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 0 .6rem; gap: 1rem; }
  header h1 { font-size: 1.25rem; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: .5rem; }
  .pill { font-size: .78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .7rem; background: var(--card); white-space: nowrap; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  #drop { padding: 2rem 1rem; text-align: center; border: 2px dashed var(--line); background: var(--card); border-radius: 12px; cursor: pointer; transition: .15s; }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 1.05rem; margin-bottom: .2rem; }
  #drop small { color: var(--muted); }
  #docbar { display: none; align-items: center; gap: .8rem; padding: .7rem 1rem; }
  #docbar .icon { font-size: 1.6rem; }
  #docbar .info { flex: 1; min-width: 0; }
  #docbar .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #docbar .sub { color: var(--muted); font-size: .8rem; }
  .link { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: .35rem .8rem; cursor: pointer; font-size: .85rem; }
  .link:hover { border-color: var(--accent); color: var(--accent); }

  #feed { flex: 1; padding: 1rem 0; display: flex; flex-direction: column; gap: 1rem; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; }
  .msg-user { align-self: flex-end; background: var(--user); color: #fff; padding: .55rem .9rem; border-radius: 14px 14px 2px 14px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-bot { align-self: flex-start; width: 100%; padding: .9rem 1rem; }
  .msg-bot .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-bot.notfound { background: var(--warn-bg); border-color: var(--warn-line); }
  .msg-bot.notfound .badge-nf { display: inline-block; font-size: .75rem; font-weight: 600; color: var(--warn-text); margin-bottom: .3rem; letter-spacing: .03em; text-transform: uppercase; }
  .msg-bot.error { border-color: var(--err); color: var(--err); }

  .sources { margin-top: .7rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .sources .lbl { color: var(--muted); font-size: .8rem; }
  .chip { border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: .15rem .7rem; font-size: .8rem; cursor: pointer; font-weight: 600; }
  .chip[aria-expanded=true] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .snippet { margin-top: .5rem; padding: .5rem .8rem; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: .85rem; color: var(--text); overflow-wrap: anywhere; }
  .snippet b { color: var(--accent); }
  .meta { margin-top: .6rem; display: flex; gap: .5rem; flex-wrap: wrap; font-size: .75rem; color: var(--muted); }
  .tag { border: 1px solid var(--line); border-radius: 6px; padding: 0 .4rem; }
  .tag.ok { color: var(--ok); border-color: var(--ok); }

  .dots span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: b 1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 25%); padding: 1rem 0 1.2rem; }
  .composer .box { display: flex; gap: .6rem; padding: .5rem; align-items: flex-end; }
  textarea { flex: 1; border: 0; background: transparent; color: var(--text); font: inherit; resize: none; outline: none; padding: .4rem .5rem; max-height: 140px; }
  button.send { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: .55rem 1.2rem; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--muted); font-size: .75rem; margin-top: .4rem; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>PDF Q&amp;A <span>answers only from your document</span></h1>
    <div class="pill" id="usage">Gemini usage: --</div>
  </header>

  <input type="file" id="file" accept="application/pdf" hidden>
  <div id="drop" tabindex="0" role="button" aria-label="Upload a PDF">
    <strong>Drop a PDF here, or click to browse</strong>
    <small>Text-based PDFs up to 20 MB</small>
  </div>
  <div id="docbar" class="card">
    <div class="icon">&#128196;</div>
    <div class="info"><div class="name" id="docname"></div><div class="sub" id="docsub"></div></div>
    <button class="link" id="replace">Replace</button>
  </div>

  <main id="feed" aria-live="polite">
    <div class="empty" id="empty">Upload a PDF to start asking questions.</div>
  </main>

  <div class="composer">
    <div class="card box">
      <textarea id="q" rows="1" maxlength="500" placeholder="Ask a question about the document..." disabled></textarea>
      <button class="send" id="ask" disabled>Ask</button>
    </div>
    <div class="hint">Enter to send &middot; Shift+Enter for a new line &middot; each question is answered independently</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LS = "pdfqa.doc";
let doc = null, busy = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function post(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({ error: "Unexpected server response." }));
  if (!r.ok) throw new Error(data.error || "Request failed.");
  return data;
}

function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); }

function setDoc(d) {
  doc = d;
  const on = !!d;
  $("drop").style.display = on ? "none" : "";
  $("docbar").style.display = on ? "flex" : "none";
  $("q").disabled = $("ask").disabled = !on;
  if (on) {
    $("docname").textContent = d.name;
    $("docsub").textContent = `${d.chunks} chunks indexed` + (d.reused ? " · embeddings reused, no API calls" : "");
    localStorage.setItem(LS, JSON.stringify(d));
    $("q").focus();
  } else {
    localStorage.removeItem(LS);
  }
}

async function upload(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return flash("That file is not a PDF.");
  const fd = new FormData(); fd.append("file", file);
  $("drop").querySelector("strong").textContent = `Indexing ${file.name}...`;
  try {
    const d = await post("/upload", { method: "POST", body: fd });
    $("feed").replaceChildren();
    setDoc(d);
    refreshUsage();
  } catch (e) {
    flash(e.message);
  }
  $("drop").querySelector("strong").textContent = "Drop a PDF here, or click to browse";
}

function flash(msg) {
  const m = el("div", "card msg-bot error");
  m.append(el("div", "text", msg));
  $("empty")?.remove();
  $("feed").append(m);
  scrollDown();
}

function renderAnswer(d) {
  const box = el("div", "card msg-bot" + (d.answerable ? "" : " notfound"));
  if (!d.answerable) box.append(el("div", "badge-nf", "Not found in document"));
  box.append(el("div", "text", d.answer));

  if (d.citations.length) {
    const row = el("div", "sources");
    row.append(el("span", "lbl", "Sources:"));
    const snip = el("div");
    for (const c of d.citations) {
      const chip = el("button", "chip", `Page ${c.page}`);
      chip.setAttribute("aria-expanded", "false");
      chip.onclick = () => {
        const open = chip.getAttribute("aria-expanded") === "true";
        row.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-expanded", "false"));
        snip.replaceChildren();
        if (!open) {
          chip.setAttribute("aria-expanded", "true");
          const s = el("div", "snippet");
          s.append(el("b", "", `Page ${c.page}: `), document.createTextNode(`“${c.snippet}…”`));
          snip.append(s);
        }
      };
      row.append(chip);
    }
    box.append(row, snip);
  }

  const meta = el("div", "meta");
  if (d.cached) meta.append(el("span", "tag ok", "from cache · 0 API calls"));
  else if (d.llm_called) meta.append(el("span", "tag", `${d.usage.input} in / ${d.usage.output} out tokens`));
  else meta.append(el("span", "tag ok", "refused by retrieval · no answer call"));
  box.append(meta);
  return box;
}

async function refreshUsage() {
  try {
    const u = await post("/usage"), g = u.generate;
    $("usage").textContent = g ? `Gemini usage: ${g.calls} call${g.calls === 1 ? "" : "s"} · ${g.input_tokens} in / ${g.output_tokens} out`
                               : "Gemini usage: no answer calls yet";
  } catch (e) { /* non-critical */ }
}

async function ask() {
  const question = $("q").value.trim();
  if (!question || busy || !doc) return;
  busy = true; $("ask").disabled = true;
  $("empty")?.remove();
  $("feed").append(el("div", "msg-user", question));
  $("q").value = ""; autosize();
  const wait = el("div", "card msg-bot");
  wait.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  $("feed").append(wait); scrollDown();
  try {
    const d = await post("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify({ doc_id: doc.id, question }) });
    wait.replaceWith(renderAnswer(d));
  } catch (e) {
    wait.remove();
    if (/Upload a PDF first/.test(e.message)) setDoc(null);  // server no longer knows this document
    flash(e.message);
  }
  busy = false; $("ask").disabled = !doc; $("q").focus();
  scrollDown(); refreshUsage();
}

function autosize() { const t = $("q"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") $("file").click(); };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files[0]); };
$("file").onchange = e => { upload(e.target.files[0]); e.target.value = ""; };
$("replace").onclick = () => $("file").click();
$("ask").onclick = ask;
$("q").addEventListener("input", autosize);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });

try { const saved = JSON.parse(localStorage.getItem(LS)); if (saved && saved.id) { setDoc(saved); $("empty").textContent = "Ask a question about " + saved.name + "."; } } catch (e) {}
refreshUsage();
</script>
</body>
</html>
